; ============================================================
;  Tijolo — dumbphone com a LILYGO T-A7670SA-S3-Standard
;  Fase 2: tela, teclado 3x4 e botões (o Monitor Serial continua valendo)
; ============================================================

[platformio]
default_envs = tijolo

[env]
; Mesma plataforma do robô de mesa: pioarduino, com o core Arduino-ESP32 3.x.
; (O 3.x traz a biblioteca PPP, que a Fase 4 usa para o modo roteador.)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; A LILYGO usa o ESP32-S3-WROOM-1 N16R2: 16 MB de flash e 2 MB de PSRAM QSPI.
; ATENÇÃO: é diferente da sua DevKitC N16R8 (PSRAM OPI). Gravar um firmware
; feito para a outra placa não estraga nada, mas ele não liga direito.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -D BOARD_HAS_PSRAM
    ; A porta "ESP-USB" é a USB nativa do ESP32-S3: o Serial sai por ela.
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
; O decoder traduz travamentos; sem o filtro "time" para não atrapalhar
; o que você digita.
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; A tela usa a LovyanGFX, a mesma versão do robô de mesa (o PlatformIO
; baixa sozinho na primeira compilação).
lib_deps =
    lovyan03/LovyanGFX @ 1.2.30

[env:tijolo]
